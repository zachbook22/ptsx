[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptsx"
version = "0.1.0"
description = "Dual-track turn-taking editor for aligned User/Assistant WAVs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
  "scipy>=1.11",
  "onnxruntime>=1.16",
  "openai-whisper>=20231117",
  "pedalboard>=0.9",
  "pyloudnorm>=0.1.1",
]

[project.scripts]
ptsx = "ptsx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
transcribe = ["openai-whisper>=20231117"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
ptsx = ["models/*.onnx", "macos_stub", "macos_launcher.c"]
